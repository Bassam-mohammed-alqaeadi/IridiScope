# Build IridiScope on pushes to master.

name: Build IridiScope

on:
  push:
    branches: ["master"]

permissions:
  contents: read

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libfftw3-dev libcurl4-openssl-dev \
          libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}
